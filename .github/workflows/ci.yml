name: ci

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      release_seal:
        description: "Run Tier 2 release seal across apps/louis and apps/vision"
        default: "true"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_BUILD_JOBS: "2"

jobs:
  tier1-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Tier 1 Pin Verification
        run: python3 .github/scripts/verify-pins.py --tier all
      - name: Tier 1 Workspace Diag Gate
        run: python3 .github/scripts/release_seal.py --split diag

  tier2-release-seal:
    needs: tier1-pr
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc & Tauri system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler \
            pkg-config libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - name: Tier 2 Holdout Release Seal
        run: python3 .github/scripts/release_seal.py --release-seal --split holdout --output gate_report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-report
          path: gate_report.json
