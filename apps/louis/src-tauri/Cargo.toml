[package]
name = "louis-desktop"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Qntology/louis-vision"
description = "Louis-Vision primary desktop anchor: ( ✦ ) click-through overlay, Docs Studio, Field-3D, 5-layer DataFusion SQL AST guard, and 127.0.0.1:8787 dual-app loopback router"

[lib]
name = "louis_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["hwp-writer"]
hwp-writer = ["louis-docs/hwp-writer", "lv-doc/hwp-writer"]
field-3d = ["louis-docs/field-3d", "dep:lv-spatial", "dep:lv-planar", "lv-router/spatial-planar"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
louis-docs = { path = ".." }
lv-sds = { path = "../../../crates/lv-sds" }
lv-core = { path = "../../../crates/lv-core" }
lv-screen = { path = "../../../crates/lv-screen" }
lv-doc = { path = "../../../crates/lv-doc", features = ["docs-io"] }
lv-spatial = { path = "../../../crates/lv-spatial", optional = true }
lv-planar = { path = "../../../crates/lv-planar", optional = true, features = ["domain", "screen"] }
lv-router = { path = "../../../crates/lv-router", features = ["planar-2d"] }
lv-domain = { path = "../../../crates/lv-domain" }
lv-agent = { path = "../../../crates/lv-agent" }
premium-discount-eval = { git = "https://github.com/Qntology/premium-discount", rev = "dae2667e498b65e6eb92ca0bd3ebf7e10c75c675", features = ["hygiene"] }
premium-discount-window = { git = "https://github.com/Qntology/premium-discount", rev = "dae2667e498b65e6eb92ca0bd3ebf7e10c75c675" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
once_cell = "1"
sha2 = "0.10"
sqlparser = "0.61"
zeroize = { version = "1", features = ["derive"] }
