<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Louis Desktop Overlay</title>
  <link rel="stylesheet" href="../../shared-ui/css/tokens.css" />
  <link rel="stylesheet" href="../../shared-ui/css/widgets.css" />
</head>
<body data-surface="louis_desktop_overlay" data-n2sf="sensitive">
  <div class="lv-n2sf-edge" aria-hidden="true"></div>
  <div class="lv-classified-watermark" aria-hidden="true">CLASSIFIED · INTERNAL AUDIT</div>

  <div id="lv-omni-backdrop" class="lv-omni-backdrop" hidden>
    <div class="lv-omni-box" role="dialog" aria-label="Louis Omni-Bar">
      <input id="lv-omni-input" type="text" placeholder="검색, type:BL, dom:DOM-08, /sim, /stage, SQL 집계..." />
      <div id="lv-omni-status" class="lv-muted"></div>
    </div>
  </div>

  <aside id="lv-star-root" data-stage="mini" data-shield="clear">
    <ol id="lv-mini-feed" class="lv-mini-feed" aria-live="polite"></ol>
    <button id="lv-star-btn" class="lv-star-btn" type="button" aria-label="Louis Assistant 열기">
      <span class="lv-star-ring" aria-hidden="true"></span>
      <span class="lv-star-glyph" aria-hidden="true">✦</span>
      <span id="lv-star-badge" class="lv-star-badge" hidden>0</span>
    </button>
    <section id="lv-chat-popover" class="lv-chat-popover" hidden>
      <header id="lv-chat-head" class="lv-chat-head drag-area">
        <span id="lv-n2sf-dot" class="lv-n2sf-dot" data-grade="sensitive"></span>
        <strong id="lv-chat-title" data-i18n="star_title">✦ Louis Assistant</strong>
        <span id="lv-unit-chip" class="lv-unit-chip" hidden></span>
        <div class="lv-head-actions">
          <button id="lv-btn-studio" type="button" data-tip="Docs Studio">[+]</button>
          <button id="lv-btn-collapse" type="button" data-tip="Collapse">[-]</button>
        </div>
      </header>
      <div class="lv-chat-wrap">
        <div id="lv-pull-top" class="lv-pull-indicator" hidden data-i18n="pull_prev">이전 대화 불러오기</div>
        <div id="lv-chat-scroll" class="lv-chat-scroll">
          <div id="lv-chat-stream" class="lv-chat-stream"></div>
        </div>
      </div>
      <form id="lv-chat-form" class="lv-chat-form" autocomplete="off">
        <button id="lv-btn-attach" type="button" aria-label="파일·폴더 등록">+</button>
        <input id="lv-chat-input" type="text" placeholder="질의, /명령어, SQL 집계 요청..." />
        <button id="lv-btn-send" type="submit" aria-label="전송">Send</button>
      </form>
    </section>
  </aside>

  <script type="module" src="./louis-app.js"></script>
</body>
</html>
