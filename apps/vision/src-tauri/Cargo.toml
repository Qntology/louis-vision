[package]
name = "vision-sandbox-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Vision Sandbox logistics robot simulator: presets, grasp and drive tests, SigLIP2 classification, Lance dataset"

[lib]
name = "vision_sandbox_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
sandbox-core = { path = "../crates/sandbox-core" }
sandbox-data = { path = "../crates/sandbox-data" }
sandbox-runtime = { path = "../crates/sandbox-runtime" }
lv-core = { workspace = true }
lv-spatial = { workspace = true }
premium-discount-manifest = { workspace = true }
candle-core = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
image = { workspace = true, features = ["jpeg", "png"] }
base64 = "0.22"
tokio = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }
sha2 = "0.10"

[features]
default = []
cuda = ["sandbox-runtime/cuda", "lv-core/cuda"]
metal = ["sandbox-runtime/metal", "lv-core/metal"]
vulkan = ["sandbox-runtime/vulkan", "lv-core/vulkan"]
rocm = ["sandbox-runtime/rocm", "lv-core/rocm"]
