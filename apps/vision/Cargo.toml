# Qntology/louis-vision/apps/vision/Cargo.toml
# Unified Tier 2-B2 workspace:
#   - `vision-sandbox` (root package): 100% air-gapped 60fps concert/broadcast XR live engine
#   - `sandbox-core`, `sandbox-world`, `sandbox-search`, `sandbox-quest`, `sandbox-runtime`:
#     pure-Rust simulator engine crates (0 WAN HTTP / 0 lancedb / 0 tauri in normal dependencies)
#   - `sandbox-data`: synthetic LanceDB dataset store (isolates `lancedb`)
#   - `vision-sandbox-app` (`src-tauri`): desktop UI & offline/optional model manager (isolates `tauri` + `reqwest`)

[workspace]
resolver = "2"
members = [
    ".",
    "crates/sandbox-core",
    "crates/sandbox-data",
    "crates/sandbox-world",
    "crates/sandbox-search",
    "crates/sandbox-quest",
    "crates/sandbox-runtime",
    "src-tauri",
]
default-members = ["."]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Qntology/louis-vision"

[workspace.dependencies]
# Tier 1 zero-SAM3.1 stereo spatial, residency & temporal gate crates (local paths ONLY)
lv-kernels = { path = "../../crates/lv-kernels" }
lv-sds     = { path = "../../crates/lv-sds", features = ["granite-ttm"] }
lv-core    = { path = "../../crates/lv-core" }
lv-spatial = { path = "../../crates/lv-spatial", features = ["granite-ttm"] }
lv-router  = { path = "../../crates/lv-router", default-features = false, features = ["spatial-3d"] }
lv-doc     = { path = "../../crates/lv-doc", default-features = false }
lv-domain  = { path = "../../crates/lv-domain" }
lv-planar  = { path = "../../crates/lv-planar", default-features = false, features = ["domain", "screen"] }

# Tier 0 (Qntology/premium-discount) pinned to PD_LIB_PIN_REV
premium-discount-cpu-kernels = { git = "https://github.com/Qntology/premium-discount", rev = "b024dbb5e12bdb4fc1fcf83d0d62e5a645baccb5" }
premium-discount-eval        = { git = "https://github.com/Qntology/premium-discount", rev = "b024dbb5e12bdb4fc1fcf83d0d62e5a645baccb5" }
premium-discount-manifest    = { git = "https://github.com/Qntology/premium-discount", rev = "b024dbb5e12bdb4fc1fcf83d0d62e5a645baccb5" }
premium-discount-nms         = { git = "https://github.com/Qntology/premium-discount", rev = "b024dbb5e12bdb4fc1fcf83d0d62e5a645baccb5" }
premium-discount-quant       = { git = "https://github.com/Qntology/premium-discount", rev = "b024dbb5e12bdb4fc1fcf83d0d62e5a645baccb5" }
premium-discount-sds         = { git = "https://github.com/Qntology/premium-discount", rev = "b024dbb5e12bdb4fc1fcf83d0d62e5a645baccb5", features = ["audit"] }

# Shared runtime, image, tokenizer & compute crates (0 lancedb / 0 tauri / 0 WAN HTTP in workspace root)
anyhow      = "1"
thiserror   = "2"
serde       = { version = "1", features = ["derive"] }
serde_json  = { version = "1", features = ["float_roundtrip"] }
sha2        = "0.10"
image       = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
tokenizers  = { version = "0.22", default-features = false, features = ["onig"] }
tokio       = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "fs"] }
futures     = "0.3"
rayon       = "1"
webp        = "0.3"
candle-core = "0.11.0"
candle-nn   = "0.11.0"
candle-rocm = { git = "https://github.com/Qntology/candle-rocm-vulkan", rev = "f73415d4d149d7949e8a6a94911af670e4e10f7f" }

[package]
name = "vision-sandbox"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default   = []
planar-xr = ["dep:lv-planar", "lv-router/spatial-planar"]
cuda      = ["lv-core/cuda", "lv-planar?/cuda"]
rocm      = ["lv-core/rocm", "lv-planar?/rocm"]
vulkan    = ["lv-core/vulkan", "lv-planar?/vulkan"]
metal     = ["lv-core/metal", "lv-planar?/metal"]

[dependencies]
# Tier 1 stereo spatial, residency, planar geometry, & temporal gate crates
lv-kernels = { workspace = true }
lv-sds     = { workspace = true }
lv-core    = { workspace = true }
lv-spatial = { workspace = true }
lv-router  = { workspace = true }
lv-planar  = { workspace = true, optional = true }

# Tier 0 universal evaluation & hash-chained audit ledger
premium-discount-eval = { workspace = true }
premium-discount-sds  = { workspace = true }

# Local pure-Rust rig & CAD geometry crate
sandbox-core = { path = "crates/sandbox-core" }

# Local runtime, lossless image decode, and loopback/LAN transport (0 WAN HTTP crates)
anyhow      = { workspace = true }
thiserror   = { workspace = true }
candle-core = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
sha2        = { workspace = true }
image       = { workspace = true }
tokio       = { workspace = true }

[patch.crates-io]
candle-core       = { git = "https://github.com/Qntology/candle-rocm-vulkan", rev = "f73415d4d149d7949e8a6a94911af670e4e10f7f" }
candle-nn         = { git = "https://github.com/Qntology/candle-rocm-vulkan", rev = "f73415d4d149d7949e8a6a94911af670e4e10f7f" }
candle-flash-attn = { git = "https://github.com/Qntology/candle-rocm-vulkan", rev = "f73415d4d149d7949e8a6a94911af670e4e10f7f" }

[profile.dev]
debug = 0
incremental = false

[profile.dev.package.candle-core]
opt-level = 3
[profile.dev.package.candle-nn]
opt-level = 3
[profile.dev.package.tokenizers]
opt-level = 3
[profile.dev.package.sandbox-world]
opt-level = 3
[profile.dev.package.sandbox-core]
opt-level = 3
[profile.dev.package.premium-discount-cpu-kernels]
opt-level = 3
[profile.dev.package.premium-discount-quant]
opt-level = 3
[profile.dev.package.lv-kernels]
opt-level = 3
[profile.dev.package.lv-spatial]
opt-level = 3
[profile.dev.package.lv-planar]
opt-level = 3
[profile.dev.package.lv-doc]
opt-level = 3
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.rayon]
opt-level = 3
[profile.dev.package.gemm]
opt-level = 3
[profile.dev.package.gemm-common]
opt-level = 3
[profile.dev.package.gemm-f32]
opt-level = 3
[profile.dev.package.gemm-f16]
opt-level = 3
[profile.dev.package.pulp]
opt-level = 3
[profile.dev.package.lv-core]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[dev-dependencies]
sandbox-core = { path = "crates/sandbox-core" }
sandbox-runtime = { path = "crates/sandbox-runtime", features = ["planar-xr"] }
lv-planar = { workspace = true }
lv-domain  = { workspace = true }
lv-doc     = { workspace = true, default-features = false }
