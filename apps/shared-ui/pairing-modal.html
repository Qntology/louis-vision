<dialog id="lv-pair-modal" class="lv-glass-modal" aria-labelledby="pair-title">
  <header class="lv-modal-head">
    <h2 id="pair-title" data-i18n="pair_title">로컬 보안 단말 연결 (Zero-WAN · X25519)</h2>
    <span id="lan-subnet-badge" class="lv-pill">LAN 192.168.45.x : 9999</span>
  </header>

  <div class="lv-pair-grid">
    <section class="lv-qr-card">
      <div id="pair-qr-box" class="lv-qr-box" aria-label="사설망 페어링 QR"></div>
      <p class="lv-muted" data-i18n="pair_qr_hint">동일 공유기/핫스팟 스마트폰으로 스캔하세요 (STUN/TURN 없음)</p>
    </section>

    <section class="lv-role-card">
      <label class="lv-field-label" for="pair-role-select" data-i18n="pair_role_label">연결 단말 역할·스킨 지정</label>
      <select id="pair-role-select">
        <option value="personal_phone">사무·현장 개인 금고 &amp; 2D 스캐너 (C/S/O)</option>
        <option value="counter_kiosk">민원 창구 접수 전용 키오스크 (Open 감옥)</option>
        <option value="sim_workbench_cam">Sim 실물 작업대 스테레오 카메라</option>
        <option value="wireless_camera_rig">Stage 무대 거치 무선 리그 (암전 터치락)</option>
        <option value="stage_cue_remote">Stage 연출가 큐·인터록 리모컨</option>
      </select>

      <div class="lv-seed-box">
        <span>내 대역: <b id="pair-ip-prefix">192.168.45.</b></span>
        <input id="pair-target-host" type="number" min="1" max="254" placeholder="호스트" />
        <input id="pair-seed-input" type="number" min="10" max="99" placeholder="시드(10~99)" />
        <button id="btn-lan-scan" type="button" data-i18n="pair_connect">사설망 연결</button>
      </div>

      <button id="btn-bip39-recover" class="lv-link-btn" type="button" data-i18n="pair_recover">
        단말 분실 시 12단어 오프라인 복구 구문 입력
      </button>
    </section>
  </div>
</dialog>
