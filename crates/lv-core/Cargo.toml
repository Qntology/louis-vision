[package]
name = "lv-core"
description = "Layer 1 zero-network unified vision & inference core: 5-backend device probe, Residency (Coexist/Pinned), SigLIP2 (4 profiles + SparsePass + EpochWatch), Gemma4 multimodal vision tower, 2-phase VLM OcrEngine + Halo1Hop, and domain-neutral PointerModel / JevHead"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
cuda = ["candle-core/cuda", "candle-nn/cuda"]
rocm = ["candle-core/rocm", "candle-nn/rocm", "dep:candle-rocm"]
vulkan = ["candle-core/vulkan", "candle-nn/vulkan"]
metal = ["candle-core/metal", "candle-nn/metal"]
flash-attn = ["candle-nn/flash-attn"]
turbo-quant = ["candle-nn/turbo-quant"]

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
once_cell.workspace = true
half.workspace = true
memmap2.workspace = true
rayon.workspace = true
smallvec.workspace = true
sha2.workspace = true
zeroize.workspace = true
safetensors.workspace = true
image.workspace = true
tokenizers.workspace = true
candle-core.workspace = true
candle-nn.workspace = true
candle-rocm = { workspace = true, optional = true }
lv-kernels.workspace = true
lv-sds.workspace = true
premium-discount-cpu-kernels.workspace = true
premium-discount-quant.workspace = true
premium-discount-eval.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Memory"] }
