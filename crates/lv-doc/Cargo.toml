[package]
name = "lv-doc"
description = "Zero-network 2D document/blueprint vision & hybrid AST office reader/writer: ZZD1 delta, TitleBlock invariant, 3-Way crop, Value Grounding, native OWPML/DOCX/HWP/PDF IR, and WriterGuard"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default     = ["office-io"]
office-io   = ["dep:cfb", "dep:zip", "dep:quick-xml", "dep:calamine", "dep:csv", "dep:pdf-extract", "dep:flate2"]
hwp-writer  = ["office-io"]
cuda        = ["lv-core/cuda"]
rocm        = ["lv-core/rocm"]
vulkan      = ["lv-core/vulkan"]
metal       = ["lv-core/metal"]
flash-attn  = ["lv-core/flash-attn"]
turbo-quant = ["lv-core/turbo-quant"]

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
half.workspace = true
rayon.workspace = true
once_cell.workspace = true
smallvec.workspace = true
base64 = "0.22"
image.workspace = true
imageproc.workspace = true
lv-kernels.workspace = true
lv-sds.workspace = true
lv-core.workspace = true
premium-discount-sds.workspace = true
premium-discount-nms.workspace = true
premium-discount-eval.workspace = true
premium-discount-quant.workspace = true

cfb         = { version = "0.14", optional = true }
zip         = { version = "8.6", optional = true }
quick-xml   = { version = "0.41", optional = true }
calamine    = { version = "0.36", optional = true }
csv         = { version = "1.4", optional = true }
pdf-extract = { version = "0.12", optional = true }
flate2      = { version = "1.0", optional = true }
